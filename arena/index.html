  <script>
    // Apply the theme and contrast before first paint to avoid a flash. The
    // same rules as js/theme.js: the arena's choice, else Canuckle's, else the
    // device's.
    (function () {
      var get = function (k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
      var t = get('arena.theme');
      if (t !== 'light' && t !== 'dark') {
        var d = get('flutter.isDarkMode');
        if (typeof d === 'boolean') t = d ? 'dark' : 'light';
      }
      if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
      var c = get('arena.highContrast');
      if (typeof c !== 'boolean') c = get('flutter.isHighContrast') === true;
      if (c) document.documentElement.dataset.contrast = 'high';
    })();
  </script>
  <script type="module" src="js/app.js?v=202610141420"></script>
</head>
<body>
  <!-- Ad slots: the same classes, sizes and order as the games' pages (see
       canuckleSite/index.html); js/ads.js loads the tag that fills them. The
