    Canuckle page template. deploy_to_io.ps1 and deploy_to_site.ps1 copy this
    file to the site root on every run (then stamp flutter_bootstrap.js?version=),
    so edit it here, never in canuckleSite or jeffrrogers.github.io.
    The same file serves production and the sandbox: everything that differs
    comes from the CANUCKLE_PROD host test below.

    Served from the site root, so <base href> stays "/".
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"> <!--added from original-->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">  <!--added from original-->

  <script>
    // Production = canucklegame.ca and its subdomains. Off it (sandbox, localhost)
    // there are no analytics and no Yolla; ad slots show coloured placeholders.
    // Analytics is Firebase Analytics (G-RPLYG6MC2K), started from Dart on
    // production only -- it loads gtag.js itself, so nothing is loaded here.
    window.CANUCKLE_PROD = /(^|\.)canucklegame\.ca$/.test(location.hostname);
    if (!window.CANUCKLE_PROD) document.documentElement.classList.add('ad-preview');

    // Old GitHub Pages host: send players to the real site.
    if (/canucklegame.github.io/.test(window.location) === true) {
      window.location = 'https://www.canucklegame.ca'
    }
  </script>

    /* Hidden once the engine dispatches 'flutter-first-frame'. On total

      <script>
        (function () {
          var overlay = document.getElementById('canuckle-loading');

          window.__canuckleHideLoading = function () {
            if (overlay) overlay.classList.add('canuckle-hidden');
          };

          window.__canuckleShowError = function () {
            if (overlay) {
              overlay.classList.remove('canuckle-hidden');
              overlay.classList.add('canuckle-error-state');
            }
          };

          // Dispatched by the Flutter web engine on `window` once the first
          // frame has been rasterized, regardless of renderer.
          window.addEventListener('flutter-first-frame', function () {
            window.__canuckleHideLoading();
          });

          // CanvasKit's canvas can lose its WebGL context (seen on Chrome for
          // iOS, which sandboxes WKWebView's GPU/context budget more tightly
          // than Safari -- ad iframes claiming their own WebGL contexts can
          // exhaust it). Flutter Web has no public API to resume painting
          // after that, so rather than leave the app silently half-rendered,
          // wait a short grace period for the browser to restore the context
          // on its own, then fall back to the existing reload UI.
          var CONTEXT_LOST_GRACE_MS = 4000;
          var contextLostAt = null;

          document.addEventListener('webglcontextlost', function (event) {
            event.preventDefault(); // signal intent to attempt recovery
            contextLostAt = Date.now();
            console.warn('Canuckle: WebGL context lost -- waiting for recovery.');
            setTimeout(function () {
              if (contextLostAt) {
                console.error('Canuckle: WebGL context not restored -- showing reload UI.');
                window.__canuckleShowError();
              }
            }, CONTEXT_LOST_GRACE_MS);
          }, true);

          document.addEventListener('webglcontextrestored', function () {
            contextLostAt = null;
          }, true);
        })();
      </script>
