<!DOCTYPE html>
<!-- Canuckle Duo's share page. duo.canucklegame.ca should redirect here, so
     link previews get Duo's title and image (crawlers read these tags and
     don't run scripts); players are sent straight on to the game. Copied to
     the site's duo/ folder by deploy_to_site.ps1 and deploy_to_io.ps1. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canuckle Duo - Two Canadian words, one daily puzzle</title>
  <meta name="description" content="Guess two hidden words at once in 7 tries. A new pair every day.">
  <link rel="canonical" href="https://www.canucklegame.ca/?duo=true">

  <meta property="og:url" content="https://www.canucklegame.ca/duo/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Canuckle Duo - Two Canadian words, one daily puzzle">
  <meta property="og:description" content="Guess two hidden words at once in 7 tries. A new pair every day.">
  <meta property="og:image" content="https://www.canucklegame.ca/images/canuckleduo_og_1200x630.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://www.canucklegame.ca/images/canuckleduo_og_1200x630.png">

  <link rel="icon" type="image/png" href="/duo/images/canuckleduo_logo_32x32.png">
  <link rel="apple-touch-icon" href="/duo/images/canuckleduo_logo_192x192.png">
  <link rel="manifest" href="/duo/images/manifest.json">
  <script>
    // Keep any other query parameters (e.g. the sandbox's week offset).
    var q = new URLSearchParams(location.search);
    q.set('duo', 'true');
    location.replace('/?' + q.toString());
  </script>
</head>
<body>
  <p><a href="/?duo=true">Play Canuckle Duo</a></p>
</body>
</html>
